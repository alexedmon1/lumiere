[project]
name = "lumiere"
version = "0.4.2"
description = "Lumière: a study's results as one static page, and the results specification and checker that every analysis tool writes to"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Alex D. Edmondson"}]
dependencies = []  # standard library only, so any producer or reader can install it

[project.optional-dependencies]
dev = ["pytest>=7.0", "pandas>=2.0", "numpy>=1.24", "ruff"]

[project.scripts]
lumiere = "lumiere.__main__:main"
neurobox = "lumiere.__main__:main"  # the old name, until every tool has moved

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumiere", "src/neurobox"]  # neurobox: the old name, forwarding to lumiere

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py

