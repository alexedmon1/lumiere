<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$title</title>
<link rel="stylesheet" href="assets/gallery.css">
<link rel="stylesheet" href="assets/vendor/glightbox.min.css">
<script>window.GALLERY = $manifest;</script>
</head>
<body>
<nav id="sidebar">

    <h1 id="gallery-title"><a href="#/">$title</a></h1>

      <span class="theme-icon-light">&#9788;</span>
      <span class="theme-icon-dark">&#9790;</span>
    </button>
    <span class="built">built $built</span>
  </div>
</nav>
<main id="content">
  <div id="breadcrumb"></div>
  <div id="source-selector"></div>
  <div id="page"></div>
</main>
<script src="assets/vendor/glightbox.min.js"></script>
<script src="assets/vendor/tablesort.min.js"></script>

</html>
